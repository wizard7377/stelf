name: Build and Test

# Merges into master arrive here as a `push` event, so there is deliberately no
# `pull_request: types: [closed]` -- that would run the whole matrix twice for
# every merge. `push` is left unfiltered so feature branches get coverage too.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: read-all

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / OCaml ${{ matrix.ocaml-compiler }}
    runs-on: ${{ matrix.os }}
    # Windows is best-effort until a real run tells us whether the TUI's
    # lambda-term/lwt.unix dependency builds there at all.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ocaml-compiler: "5.4.x"
            experimental: false
          - os: ubuntu-latest
            ocaml-compiler: "5.2.x"
            experimental: false
          - os: macos-latest
            ocaml-compiler: "5.4.x"
            experimental: false
          - os: windows-latest
            ocaml-compiler: "5.4.x"
            experimental: true

    # Windows runners default to PowerShell; every `run:` below is bash.
    defaults:
      run:
        shell: bash

    steps:
      # `basis` is a git submodule built as a workspace member, NOT an opam
      # dependency -- it is absent from stelf.opam's depends:, and dune-project's
      # (pin ...) stanza is dune-package-management-only, which opam ignores.
      # Without this, `opam install` succeeds and `dune build` then fails several
      # minutes later with `Library "basis" not found`.
      #
      # `true` rather than `recursive`: recursive would additionally clone the
      # large twelf reference tree's own submodules for no benefit, and
      # .gitmodules lists a stelf-book entry that has no gitlink in the index.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      # The built artifact is invoked directly rather than through `dune exec`,
      # so this tests what would be shipped and cannot silently re-enter the
      # build. Exit codes only -- output text belongs to the cram suite, which
      # asserts it byte for byte.
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          STELF="$PWD/_build/default/bin/main.exe"
          test -x "$STELF" || {
            echo "::error::stelf binary not found at $STELF"
            ls -la _build/default/bin/ || true
            exit 1
          }
          "$STELF" --version
          "$STELF" version
          "$STELF" help
          "$STELF" help check

      # End to end through the parts nothing else covers on CI: the
      # Embed.exe-generated Templates.ml, the project scaffolder, and the real
      # type checker. Runs in a temp dir so the generated project never lands
      # inside the dune workspace.
      - name: Smoke test project lifecycle
        run: |
          set -euo pipefail
          STELF="$PWD/_build/default/bin/main.exe"   # absolute, captured before the cd
          cd "$(mktemp -d)"
          "$STELF" setup hello
          "$STELF" check hello/stelf.toml

      # Non-blocking for now: the suite is not green on a clean checkout. Promote
      # to blocking (drop continue-on-error and the reminder step) once it is.
      - name: Run tests
        id: runtest
        continue-on-error: true
        run: opam exec -- dune runtest

      - name: Note test status
        if: always()
        run: |
          if [ "${{ steps.runtest.outcome }}" = "failure" ]; then
            echo "::warning::dune runtest FAILED. This step is currently non-blocking -- a green job does not mean a green test suite."
          else
            echo "dune runtest passed."
          fi
